name: NewDay CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newday-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  newday-quality-gate:
    name: newday-quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.29.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Record candidate and toolchain
        run: |
          node --version
          pnpm --version
          sha256sum pnpm-lock.yaml
          git rev-parse HEAD
          git rev-parse "HEAD^{tree}"
          printf 'event=%s ref=%s sha=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install branded Chrome and WebKit
        run: pnpm exec playwright install --with-deps chrome webkit

      - name: Check
        run: pnpm check

      - name: Build without deployment
        run: pnpm build

      - name: Run Chrome and WebKit end-to-end tests
        run: pnpm test:e2e --project=chrome --project=safari-webkit

      - name: Upload failed browser evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
