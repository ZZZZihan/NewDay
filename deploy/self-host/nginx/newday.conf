# Install in nginx's http context after replacing newday.example.com and
# certificate paths. Provision and renew the certificate separately.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name newday.example.com;

    ssl_certificate /etc/letsencrypt/live/newday.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newday.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 12m;
    client_body_timeout 30s;
    access_log off;

    # All routes, including /api and /_next, pass through this check.
    satisfy all;
    auth_basic "NewDay";
    auth_basic_user_file /etc/nginx/newday.htpasswd;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        # nginx consumes Basic Auth; do not forward the credential to Next/API.
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
