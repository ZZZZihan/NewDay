# CarryZ LAN acceptance profile. This does not bind Apache's 80 port or the
# existing Docker-published 3000 port. The certificate is provisioned outside
# this file and must contain IP SAN 172.23.1.127.
server {
    listen 172.23.1.127:8443 ssl;
    server_name 172.23.1.127;

    ssl_certificate /etc/nginx/newday-tls/carryz.crt;
    ssl_certificate_key /etc/nginx/newday-tls/carryz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 12m;
    client_body_timeout 30s;
    access_log off;

    satisfy all;
    auth_basic "NewDay";
    auth_basic_user_file /etc/nginx/newday.htpasswd;

    # Deliberately no HSTS: this LAN acceptance profile uses a self-signed
    # certificate until a trusted certificate and name are provisioned.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
